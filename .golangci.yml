version: "2"

run:
  timeout: 5m
  tests: true
  build-tags:
    - integration

output:
  sort-order:
    - file
    - linter

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - revive
    - gosec
    - bodyclose
    - contextcheck
    - errorlint
    - nilerr
    - unconvert
    - unparam

  settings:
    staticcheck:
      # Keep the checks previously supplied by gosimple and staticcheck.
      checks:
        - all
        - "-ST*"
        - "-QF*"
    revive:
      rules:
        - name: exported
          severity: warning
          disabled: false
        - name: package-comments
        - name: indent-error-flow
        - name: var-naming
    misspell:
      locale: US
    gosec:
      excludes:
        - G404 # math/rand is fine in tests and non-cryptographic paths
        - G115 # int->uint conversions are bounds-checked at source
    errorlint:
      errorf: true
      asserts: true
      comparison: true
  exclusions:
    generated: lax
    rules:
      - path: _test\.go
        linters:
          - gosec
          - errcheck
          - unparam
      - path: examples/
        linters:
          - errcheck
          - gosec
      - path: cmd/p4ctl/
        linters:
          - errcheck # CLI tolerates best-effort Close / Fprint on exit paths
          - gosec # CLI intentionally reads user-supplied paths (G304)
    paths:
      - third_party$
      - builtin$
      - examples$

issues:
  max-same-issues: 0
  max-issues-per-linter: 0

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      simplify: true
    goimports:
      local-prefixes:
        - github.com/zhh2001/p4runtime-go-controller
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
