name: Bug report
description: Report a reproducible problem in the library or the p4ctl CLI.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: >
        Thanks for taking the time to file a bug. Please fill in as much of the
        form as you can — reproducibility is the single most important factor
        in getting a fix merged quickly.
  - type: input
    id: version
    attributes:
      label: Library / CLI version
      description: >
        For v2, run `go list -m github.com/zhh2001/p4runtime-go-controller/v2`.
        For v1, use the module path without `/v2`. For the CLI, run `p4ctl version`.
        If it reports dev, also include `go version -m /absolute/path/to/p4ctl`.
      placeholder: v1.1.1 or a v2 tag, commit, or local replacement
    validations:
      required: true
  - type: input
    id: go_version
    attributes:
      label: Go version
      description: Output of `go version`.
      placeholder: go1.26.9 linux/amd64
    validations:
      required: true
  - type: input
    id: target
    attributes:
      label: P4Runtime target
      description: BMv2, Stratum-bmv2, Tofino, custom, etc.
      placeholder: BMv2 simple_switch_grpc
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: Minimum code / command sequence that reproduces the issue.
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Redact any sensitive data before pasting.
      render: text
